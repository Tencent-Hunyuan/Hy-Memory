name: CI

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - "hy_memory/**"
      - "tests/**"
      - "plugins/**"
      - "docs/**"
      - "pyproject.toml"
      - "memhub/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - "hy_memory/**"
      - "tests/**"
      - "plugins/**"
      - "docs/**"
      - "pyproject.toml"
      - "memhub/**"

permissions:
  contents: read

jobs:
  sdk:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: hy_memory_test
          POSTGRES_USER: hy_memory
          POSTGRES_PASSWORD: hy_memory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hy_memory -d hy_memory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HY_MEMORY_TEST_POSTGRES_DSN: postgresql://hy_memory:hy_memory_test@localhost:5432/hy_memory_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --extra faiss --extra qdrant --extra postgres
      - name: Test Chroma content updates with an isolated HTTP server
        run: uv run pytest tests/test_chroma_content_update.py -q -o log_cli=false -m "integration or not integration"
      - run: uv run pytest tests/ -q -o log_cli=false

  memhub:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: memhub
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: memhub/apps/core/uv.lock
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: uv sync --directory apps/core --all-groups --locked
      - name: Verify public source structure and privacy boundaries
        run: |
          python3 scripts/verify_structure.py
          python3 scripts/generate_core_test_index.py --check
          python3 scripts/verify_zero_collection.py
          python3 scripts/verify_zero_collection.py --self-test
      - name: Lint Node workspaces
        run: pnpm lint
      - name: Typecheck Node workspaces
        run: pnpm typecheck
      - name: Test Node workspaces
        run: pnpm test
      - name: Test release tooling
        run: pnpm test:release-scripts
      - name: Fetch and verify the pinned embedding model
        run: |
          pnpm fetch:embedding-model
          uv run --directory apps/core python -c \
            "from one_memory.embedding_assets import assets_present, verify_assets; assert assets_present(); verify_assets()"
      # The whole PR suite, not a hand-picked smoke list: files left out of a
      # named list broke on main unnoticed. ~4.8k tests, about 5 minutes.
      - name: Test Core (full core-pr suite)
        run: bash scripts/run-tests-isolated.sh core-pr -q
